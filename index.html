<!DOCTYPE html>
<html lang="en" data-season="autumn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Psychology // Interactive Seasonal Mind Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           SEASON 1: SPRING (Fresh Growth & Sakura Bloom)
           ========================================================= */
        :root, [data-season="spring"] {
            --bg: #f2f8f3;
            --card-bg: #ffffff;
            --surface: #e3f1e6;
            --text: #162b1e;
            --text-muted: #466652;
            --border: #2b593c;
            --accent: #e11d74;
            --accent-2: #059669;
            --accent-3: #d97706;
            --shadow: 4px 4px 0px #2b593c;
            --radius: 16px;
        }

        /* =========================================================
           SEASON 2: SUMMER (Solar Dopamine & Heat Melt)
           ========================================================= */
        [data-season="summer"] {
            --bg: #fff8e7;
            --card-bg: #ffffff;
            --surface: #ffedd5;
            --text: #291808;
            --text-muted: #6e4723;
            --border: #9a3412;
            --accent: #ea580c;
            --accent-2: #0284c7;
            --accent-3: #ca8a04;
            --shadow: 4px 4px 0px #9a3412;
            --radius: 14px;
        }

        /* =========================================================
           SEASON 3: AUTUMN (Cozy Introspection & Leaf Pile-Up)
           ========================================================= */
        [data-season="autumn"] {
            --bg: #1c1411;
            --card-bg: #281d18;
            --surface: #362620;
            --text: #f7ebe1;
            --text-muted: #cbb3a1;
            --border: #634436;
            --accent: #e06d3b;
            --accent-2: #eab308;
            --accent-3: #f43f5e;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            --radius: 16px;
        }

        /* =========================================================
           SEASON 4: WINTER (Arctic Clarity & Flash Freeze)
           ========================================================= */
        [data-season="winter"] {
            --bg: #0c1524;
            --card-bg: #132136;
            --surface: #1b2f4d;
            --text: #eef6ff;
            --text-muted: #93b4d8;
            --border: #2c4a75;
            --accent: #38bdf8;
            --accent-2: #818cf8;
            --accent-3: #2dd4bf;
            --shadow: 0 8px 24px rgba(3, 10, 24, 0.55);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 24px 16px 72px;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* =========================================================
           AMBIENT BACKGROUND PARTICLES
           ========================================================= */
        .season-fx {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            top: -10%;
            font-size: 1.15rem;
            opacity: 0.45;
            user-select: none;
            will-change: transform;
            animation: driftDown linear infinite;
        }

        @keyframes driftDown {
            0% { transform: translate3d(0, -5vh, 0) rotate(0deg); }
            50% { transform: translate3d(24px, 50vh, 0) rotate(180deg); }
            100% { transform: translate3d(-12px, 110vh, 0) rotate(360deg); }
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 22px 24px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            position: relative;
            transition: all 0.25s ease;
        }

        .brand h1 {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand h1 span {
            background: var(--accent);
            color: #ffffff;
            padding: 2px 9px;
            border-radius: 8px;
        }

        .brand p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .season-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .season-label {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-muted);
            margin-right: 2px;
        }

        .pill-btn {
            background: var(--surface);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 7px 11px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            transition: transform 0.12s ease, background 0.15s ease;
        }

        .pill-btn:hover {
            transform: translateY(-2px);
        }

        .pill-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        /* Seasonal Psychology Note Banner */
        .season-note {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 13px 18px;
            margin-bottom: 22px;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }

        .status-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            background: var(--card-bg);
            color: var(--text);
            border: 2px solid var(--accent);
            box-shadow: var(--shadow);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.8rem;
            font-weight: 700;
            max-width: 340px;
            display: none;
            animation: popIn 0.2s ease;
        }

        @keyframes popIn {
            from { transform: translateY(12px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Interactive Brain Lab Box */
        .brain-lab {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 22px;
            margin-bottom: 24px;
            position: relative;
            transition: all 0.25s ease;
        }

        .lab-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1.5px dashed var(--border);
        }

        .lab-title {
            font-size: 1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lab-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .lab-stage {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            min-height: 170px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .stroop-word {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            user-select: none;
        }

        .choice-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 9px 16px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease;
        }

        .action-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        /* Filter & Search Bar */
        .controls-bar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        .search-input {
            width: 100%;
            background: var(--card-bg);
            color: var(--text);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 13px 16px;
            font-size: 0.88rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .cat-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 2px 10px;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
            gap: 18px;
        }

        .psych-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 14px;
            cursor: pointer;
            position: relative;
            overflow: visible;
            transition: transform 0.25s ease, border-color 0.2s ease, background-color 0.25s ease, filter 0.25s ease;
        }

        .psych-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .tag {
            font-size: 0.68rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--surface);
            color: var(--accent-2);
            border: 1px solid var(--border);
            text-transform: uppercase;
        }

        .card-title {
            font-size: 1.02rem;
            font-weight: 800;
            margin-top: 8px;
            line-height: 1.35;
        }

        .card-hook {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .card-secret {
            display: none;
            background: var(--surface);
            border-left: 3px solid var(--accent-3);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            line-height: 1.48;
            color: var(--text);
        }

        .psych-card.revealed .card-secret {
            display: block;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent);
            border-top: 1px dashed var(--border);
            padding-top: 10px;
        }

        /* =========================================================
           SPECIALTY 1: AUTUMN LANDED LEAVES ON LETTERS/CARDS
           ========================================================= */
        .landed-leaf {
            position: absolute;
            font-size: 1.45rem;
            z-index: 15;
            cursor: grab;
            user-select: none;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.45));
            animation: leafLand 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .landed-leaf:hover {
            transform: translate(18px, -14px) rotate(45deg) scale(0.7);
            opacity: 0;
        }

        @keyframes leafLand {
            0% { transform: translateY(-35px) rotate(-40deg) scale(1.3); opacity: 0; }
            100% { transform: translateY(0) rotate(var(--rot, 15deg)) scale(1); opacity: 0.96; }
        }

        /* =========================================================
           SPECIALTY 2: WINTER 20% MID-OPEN FLASH FREEZE
           ========================================================= */
        .psych-card.frozen-mid-open {
            border-color: #7dd3fc !important;
            box-shadow: 0 0 22px rgba(56, 189, 248, 0.55), inset 0 0 28px rgba(186, 230, 253, 0.35) !important;
            background: linear-gradient(135deg, #163252 0%, #1e4976 100%) !important;
        }

        .psych-card.frozen-mid-open .card-secret {
            display: block !important;
            max-height: 44px;
            overflow: hidden;
            position: relative;
            filter: blur(1.4px);
            border-left-color: #38bdf8;
        }

        .ice-banner {
            background: rgba(14, 116, 144, 0.92);
            color: #e0f2fe;
            border: 1.5px solid #7dd3fc;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 0.72rem;
            font-weight: 800;
            text-align: center;
            animation: pulseIce 1.6s infinite alternate;
        }

        @keyframes pulseIce {
            from { box-shadow: 0 0 6px rgba(125, 211, 252, 0.4); }
            to { box-shadow: 0 0 16px rgba(125, 211, 252, 0.85); }
        }

        /* =========================================================
           SPECIALTY 3: SUMMER SCROLL MELTING EFFECT
           ========================================================= */
        .melted-box {
            transform: skewY(3.5deg) scaleY(1.09) translateY(10px) !important;
            border-bottom-left-radius: 36px !important;
            border-bottom-right-radius: 44px !important;
            border-color: #ea580c !important;
            box-shadow: 0 16px 26px rgba(234, 88, 12, 0.35) !important;
            filter: contrast(1.06) saturate(1.25);
        }

        .melted-box .card-title,
        .melted-box .card-hook {
            transform: skewX(-4deg) translateY(3px);
            filter: blur(0.45px);
        }

        .melt-drip-badge {
            background: #ffedd5;
            color: #9a3412;
            border: 1.5px solid #ea580c;
            border-radius: 8px;
            padding: 6px 9px;
            font-size: 0.71rem;
            font-weight: 800;
            text-align: center;
        }

        /* =========================================================
           SPECIALTY 4: SPRING SAKURA SPROUTING IN TABS & LETTERS
           ========================================================= */
        .sakura-sprout {
            position: absolute;
            top: -12px;
            right: -6px;
            font-size: 1.15rem;
            z-index: 20;
            pointer-events: auto;
            cursor: pointer;
            transform-origin: bottom center;
            animation: sproutGrow 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .sakura-sprout-left {
            left: -6px;
            right: auto;
        }

        @keyframes sproutGrow {
            0% { transform: scale(0) rotate(-35deg); opacity: 0; }
            70% { transform: scale(1.25) rotate(8deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @media (max-width: 640px) {
            .header-right { align-items: flex-start; }
        }
    </style>
</head>
<body>
    <!-- AMBIENT SEASONAL PARTICLES -->
    <div class="season-fx" id="season-fx" aria-hidden="true"></div>

    <!-- TOAST FEEDBACK FOR SEASON INTERACTIONS -->
    <div class="status-toast" id="status-toast"></div>

    <div class="container">
        <header id="main-header">
            <div class="brand">
                <h1>LITTLE <span>PSYCHOLOGY</span></h1>
                <p>Bite-sized mind hacks, cognitive biases &amp; human behavior decoded.</p>
            </div>
            <div class="header-right">
                <div class="season-bar">
                    <span class="season-label">SEASON:</span>
                    <button class="pill-btn" data-set-season="spring" onclick="setSeason('spring', this)">🌸 Spring</button>
                    <button class="pill-btn" data-set-season="summer" onclick="setSeason('summer', this)">☀️ Summer</button>
                    <button class="pill-btn active" data-set-season="autumn" onclick="setSeason('autumn', this)">🍂 Autumn</button>
                    <button class="pill-btn" data-set-season="winter" onclick="setSeason('winter', this)">❄️ Winter</button>
                </div>
                <button class="pill-btn" onclick="randomHack()">🎲 Random Mind Hack</button>
            </div>
        </header>

        <!-- SEASONAL SPECIALTY & COLOR PSYCHOLOGY BANNER -->
        <div class="season-note" id="season-note">
            🍂 Autumn Specialty: Leaves drift down and land right on your letters—sweep your mouse over them to brush them off!
        </div>

        <!-- LIVE INTERACTIVE BRAIN EXPERIMENTS -->
        <section class="brain-lab" id="brain-lab">
            <div class="lab-header">
                <div class="lab-title">🧠 LIVE BRAIN GLITCH LAB</div>
                <div class="lab-tabs">
                    <button class="pill-btn active" onclick="switchLab('stroop', this)">1. Stroop Conflict</button>
                    <button class="pill-btn" onclick="switchLab('anchor', this)">2. Anchoring Trap</button>
                    <button class="pill-btn" onclick="switchLab('zeigarnik', this)">3. Memory Loop</button>
                </div>
            </div>
            <div class="lab-stage" id="lab-stage"></div>
        </section>

        <!-- SEARCH & CATEGORY FILTER -->
        <div class="controls-bar">
            <input type="text" id="search-box" class="search-input" placeholder="Search tricks (e.g. eye contact, memory, silence, bias)..." oninput="filterCards()">
            <div class="cat-bar" id="cat-bar">
                <button class="pill-btn active" data-cat="all" onclick="setCategory('all', this)">All Hacks (18)</button>
                <button class="pill-btn" data-cat="social" onclick="setCategory('social', this)">Social &amp; Body Language</button>
                <button class="pill-btn" data-cat="bias" onclick="setCategory('bias', this)">Cognitive Biases</button>
                <button class="pill-btn" data-cat="focus" onclick="setCategory('focus', this)">Focus &amp; Memory</button>
                <button class="pill-btn" data-cat="persuasion" onclick="setCategory('persuasion', this)">Persuasion &amp; Influence</button>
            </div>
        </div>

        <!-- PSYCHOLOGY CARDS GRID -->
        <main class="cards-grid" id="cards-grid"></main>
    </div>

    <script>
        const hacks = [
            {
                id: 0,
                title: "The Feet Direction Tell",
                cat: "social",
                tag: "Body Language",
                hook: "People control their facial expressions when talking, but almost never control their feet.",
                secret: "If someone is facing you with their torso but their feet point toward the door or another person, their brain already wants to exit the conversation."
            },
            {
                id: 1,
                title: "The Silence Pressure Vacuum",
                cat: "persuasion",
                tag: "Negotiation",
                hook: "When someone gives you a half-answer or dodges a question, stay completely silent for 4 seconds.",
                secret: "Humans hate awkward conversational vacuums. Most people will rush to fill the silence by revealing extra details they originally intended to hide."
            },
            {
                id: 2,
                title: "The Ben Franklin Effect",
                cat: "persuasion",
                tag: "Social Hack",
                hook: "Want someone who dislikes or ignores you to warm up? Ask them for a small, easy favor.",
                secret: "The brain resolves cognitive dissonance by thinking: 'I just helped this person, so I must actually like them.'"
            },
            {
                id: 3,
                title: "The Zeigarnik Loop",
                cat: "focus",
                tag: "Productivity",
                hook: "Your brain remembers unfinished tasks almost twice as vividly as completed ones.",
                secret: "To beat procrastination, force yourself to do just 2 minutes of a task. Once started, your brain creates mental tension until it finishes."
            },
            {
                id: 4,
                title: "The Group Laughter Glance",
                cat: "social",
                tag: "Group Dynamics",
                hook: "When a group bursts out laughing, watch who looks at whom in the first half-second.",
                secret: "People instinctively glance at the person in the room they feel closest to or want approval from most."
            },
            {
                id: 5,
                title: "The Spotlight Effect",
                cat: "bias",
                tag: "Cognitive Bias",
                hook: "You feel like everyone noticed that awkward thing you said or wore today. They didn't.",
                secret: "Studies show people overestimate how much others notice their mistakes by over 50%—everyone else is too busy worrying about themselves."
            },
            {
                id: 6,
                title: "The Doorway Event Boundary",
                cat: "focus",
                tag: "Memory Glitch",
                hook: "Ever walked into a room and instantly forgotten why you went there?",
                secret: "Walking through a doorway triggers an 'event boundary' in the hippocampus, archiving your previous thought context to make room for the new environment."
            },
            {
                id: 7,
                title: "The Illusion of Choice",
                cat: "persuasion",
                tag: "Framing",
                hook: "Never ask 'Do you want to study/work now?' Instead ask 'Do you want to start with Math or Science?'",
                secret: "Offering two positive options shifts the brain from deciding 'whether' to act to deciding 'which' action to take."
            },
            {
                id: 8,
                title: "The Prattfall Effect",
                cat: "social",
                tag: "Charisma",
                hook: "Competent people become instantly more likable when they make a small, harmless mistake.",
                secret: "Perfection feels intimidating and artificial; minor flaws signal authenticity and make high achievers relatable."
            },
            {
                id: 9,
                title: "The Baader-Meinhof Illusion",
                cat: "bias",
                tag: "Perception",
                hook: "Learn a rare word or spot a specific car once, and suddenly you see it everywhere.",
                secret: "The universe didn't change—your brain's Reticular Activating System (RAS) simply flagged that pattern as high-priority."
            },
            {
                id: 10,
                title: "The Chameleon Mirroring Cue",
                cat: "social",
                tag: "Rapport",
                hook: "Subtly matching someone's posture, breathing pace, or speaking speed builds subconscious trust.",
                secret: "Mirror neurons fire when we see our own behavior reflected, signaling safety and tribal alignment—just delay it by 2–3 seconds so it isn't obvious."
            },
            {
                id: 11,
                title: "The Peak-End Rule",
                cat: "bias",
                tag: "Memory Bias",
                hook: "People don't judge an experience by its average—they judge it by its most intense moment and its ending.",
                secret: "Ending a presentation, study session, or conversation on a strong, upbeat note rewrites how the entire block is remembered."
            },
            {
                id: 12,
                title: "The Gum-Chewing Calm Hack",
                cat: "focus",
                tag: "Stress Control",
                hook: "Chewing gum before a stressful test or presentation lowers perceived anxiety.",
                secret: "Your primal brain associates eating with safety—reasoning that you wouldn't be chewing food if a predator were chasing you."
            },
            {
                id: 13,
                title: "The Name Anchor Cue",
                cat: "persuasion",
                tag: "Connection",
                hook: "Using a person's first name naturally once or twice in conversation spikes their attention.",
                secret: "Hearing one's own name activates unique auditory and self-representation circuits in the brain, cutting straight through background noise."
            },
            {
                id: 14,
                title: "The Dunning-Kruger Curve",
                cat: "bias",
                tag: "Self-Awareness",
                hook: "Beginners feel overconfident after learning the basics, while experts underestimate how much they know.",
                secret: "True mastery reveals how deep a subject actually goes, replacing loud certainty with calm curiosity."
            },
            {
                id: 15,
                title: "The Eye-Triangle Gaze",
                cat: "social",
                tag: "Confidence",
                hook: "If direct eye contact feels too intense, look at the bridge of their nose between their eyes.",
                secret: "To the other person, it looks 100% identical to confident eye contact while removing your own social tension."
            },
            {
                id: 16,
                title: "The Protégé Effect",
                cat: "focus",
                tag: "Super-Learning",
                hook: "The fastest way to master a hard topic is to pretend you have to teach it to a 10-year-old.",
                secret: "Preparing to teach forces your brain to organize scattered facts into logical cause-and-effect chains and exposes hidden blind spots."
            },
            {
                id: 17,
                title: "The Anchoring Bias",
                cat: "bias",
                tag: "Decision Trap",
                hook: "The very first number you hear in a negotiation silently hijacks every estimate that follows.",
                secret: "Even completely random numbers act as mental anchors because the brain adjusts insufficiently away from its starting point."
            }
        ];

        const seasonData = {
            spring: {
                symbol: "🌸",
                count: 6,
                note: "🌸 Spring Specialty: Sakura trees and blossoms sprout straight out of your tabs and letters!"
            },
            summer: {
                symbol: "☀️",
                count: 4,
                note: "☀️ Summer Specialty: Scroll heat melts random boxes! Hold your cursor on a melted box & switch to ❄️ Winter to solidify it!"
            },
            autumn: {
                symbol: "🍂",
                count: 8,
                note: "🍂 Autumn Specialty: Falling leaves land directly on top of your letters—sweep your cursor across them to brush them off!"
            },
            winter: {
                symbol: "❄️",
                count: 10,
                note: "❄️ Winter Specialty: 20% chance a psychology tip flash-freezes mid-open! Switch to ☀️ Summer to thaw it out."
            }
        };

        let currentSeason = 'autumn';
        let currentCategory = 'all';
        let activeIntervals = [];
        let frozenCardIds = new Set();
        let meltedCardIds = new Set();
        let hoveredCardId = null;
        let toastTimer = null;

        function showToast(msg) {
            const toast = document.getElementById('status-toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.style.display = 'none';
            }, 3800);
        }

        function clearSeasonMechanics() {
            activeIntervals.forEach(id => clearInterval(id));
            activeIntervals = [];
            document.querySelectorAll('.landed-leaf, .sakura-sprout').forEach(el => el.remove());
        }

        function spawnSeasonParticles(season) {
            const fx = document.getElementById('season-fx');
            fx.innerHTML = '';
            const config = seasonData[season] || seasonData.autumn;
            for (let i = 0; i < config.count; i++) {
                const span = document.createElement('span');
                span.className = 'particle';
                span.innerText = config.symbol;
                span.style.left = `${Math.random() * 96}%`;
                span.style.animationDuration = `${11 + Math.random() * 10}s`;
                span.style.animationDelay = `${-Math.random() * 12}s`;
                span.style.fontSize = `${0.85 + Math.random() * 0.55}rem`;
                fx.appendChild(span);
            }
        }

        /* =========================================================
           SPECIALTY 1: AUTUMN — LEAVES LANDING ON LETTERS/CARDS
           ========================================================= */
        function startAutumnLeavesOnLetters() {
            const leafIcons = ['🍂', '🍁', '🍃'];
            const dropLeaf = () => {
                if (currentSeason !== 'autumn') return;
                const targets = document.querySelectorAll('.psych-card, .brain-lab, header');
                if (!targets.length) return;
                const target = targets[Math.floor(Math.random() * targets.length)];
                if (target.querySelectorAll('.landed-leaf').length >= 4) return;

                const leaf = document.createElement('span');
                leaf.className = 'landed-leaf';
                leaf.innerText = leafIcons[Math.floor(Math.random() * leafIcons.length)];
                leaf.style.top = `${12 + Math.random() * 68}%`;
                leaf.style.left = `${10 + Math.random() * 78}%`;
                leaf.style.setProperty('--rot', `${Math.floor(Math.random() * 360)}deg`);
                leaf.title = "Sweep mouse or tap to brush leaf off!";

                const brushAway = (e) => {
                    e.stopPropagation();
                    leaf.style.transform = 'translate(28px, -18px) rotate(90deg) scale(0.4)';
                    leaf.style.opacity = '0';
                    setTimeout(() => leaf.remove(), 250);
                };
                leaf.addEventListener('mouseenter', brushAway);
                leaf.addEventListener('click', brushAway);

                target.appendChild(leaf);
            };

            dropLeaf();
            dropLeaf();
            activeIntervals.push(setInterval(dropLeaf, 2200));
        }

        /* =========================================================
           SPECIALTY 4: SPRING — SAKURA SPROUTING IN TABS & LETTERS
           ========================================================= */
        function startSpringSakuraGrowth() {
            const blooms = ['🌸', '🌱🌸', '🌿🌸', '🌺'];
            const sproutBloom = () => {
                if (currentSeason !== 'spring') return;
                const targets = document.querySelectorAll('.cat-bar .pill-btn, .lab-tabs .pill-btn, .psych-card, .season-note');
                if (!targets.length) return;
                const target = targets[Math.floor(Math.random() * targets.length)];
                if (target.querySelector('.sakura-sprout')) return;

                const sprout = document.createElement('span');
                sprout.className = 'sakura-sprout' + (Math.random() > 0.5 ? ' sakura-sprout-left' : '');
                sprout.innerText = blooms[Math.floor(Math.random() * blooms.length)];
                sprout.title = "Fresh Sakura Bloom! Click to scatter petals.";
                sprout.onclick = (e) => {
                    e.stopPropagation();
                    sprout.innerText = '✨🌸✨';
                    setTimeout(() => sprout.remove(), 450);
                };
                target.appendChild(sprout);
            };

            sproutBloom();
            sproutBloom();
            sproutBloom();
            activeIntervals.push(setInterval(sproutBloom, 2400));
        }

        /* =========================================================
           SPECIALTY 3: SUMMER — SCROLL MELTING DETECTOR
           ========================================================= */
        let lastScrollMelt = 0;
        window.addEventListener('scroll', () => {
            if (currentSeason !== 'summer') return;
            const now = Date.now();
            if (now - lastScrollMelt < 900) return;
            lastScrollMelt = now;

            if (Math.random() < 0.45) {
                const visibleCards = Array.from(document.querySelectorAll('.psych-card')).filter(c => {
                    const rect = c.getBoundingClientRect();
                    return rect.top >= 40 && rect.bottom <= window.innerHeight + 80;
                });
                if (!visibleCards.length) return;
                const victim = visibleCards[Math.floor(Math.random() * visibleCards.length)];
                const id = Number(victim.dataset.id);
                if (!meltedCardIds.has(id)) {
                    meltedCardIds.add(id);
                    filterCards();
                    showToast("☀️ HEATWAVE! A tip card started melting! Hold your cursor on it & switch to ❄️ Winter to solidify it!");
                }
            }
        }, { passive: true });

        /* =========================================================
           SWITCH SEASON + CROSS-SEASON INTERACTION LOGIC
           ========================================================= */
        function setSeason(season, btn) {
            const prevSeason = currentSeason;
            currentSeason = season;
            document.documentElement.setAttribute('data-season', season);
            localStorage.setItem('little_psych_season', season);

            document.querySelectorAll('.season-bar .pill-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            // Cross-season interaction 1: Switching to Summer thaws Winter frozen cards!
            if (season === 'summer' && frozenCardIds.size > 0) {
                const count = frozenCardIds.size;
                frozenCardIds.clear();
                showToast(`☀️ Summer heat thawed ${count} frozen psychology tip(s)! Switch back to ❄️ Winter anytime.`);
            }

            // Cross-season interaction 2: Holding mouse/pointer on a melted Summer card & switching to Winter freezes it back to normal!
            if (season === 'winter' && meltedCardIds.size > 0) {
                const activeMeltTarget = hoveredCardId !== null && meltedCardIds.has(hoveredCardId)
                    ? hoveredCardId
                    : Array.from(meltedCardIds)[0];

                if (hoveredCardId !== null && meltedCardIds.has(hoveredCardId)) {
                    meltedCardIds.delete(hoveredCardId);
                    showToast("❄️ FLASH CHILL! You held the melted card and froze it right back to normal!");
                } else if (activeMeltTarget !== undefined) {
                    meltedCardIds.delete(activeMeltTarget);
                    showToast("❄️ WINTER CHILL! Cold air solidified the melted card back to normal!");
                }
            }

            clearSeasonMechanics();
            document.getElementById('season-note').innerText = seasonData[season].note;
            spawnSeasonParticles(season);
            filterCards();

            if (season === 'autumn') startAutumnLeavesOnLetters();
            if (season === 'spring') startSpringSakuraGrowth();
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-bar .pill-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            filterCards();
        }

        function toggleCard(id, cardEl) {
            if (currentSeason === 'winter' && meltedCardIds.has(id)) {
                meltedCardIds.delete(id);
                filterCards();
                showToast("❄️ FLASH CHILL! Solidified that melted card back to normal!");
                return;
            }

            // SPECIALTY 2: WINTER 20% CHANCE TO FREEZE MID-OPEN
            if (frozenCardIds.has(id)) {
                showToast("❄️ Locked in ice! Switch to ☀️ Summer to thaw this tip, then come back.");
                return;
            }

            const isOpening = !cardEl.classList.contains('revealed');
            if (currentSeason === 'winter' && isOpening && Math.random() < 0.20) {
                frozenCardIds.add(id);
                filterCards();
                showToast("❄️ FREEZE GLITCH (20% chance)! Tip froze mid-open—switch to ☀️ Summer to thaw it!");
                return;
            }

            cardEl.classList.toggle('revealed');
        }

        function filterCards() {
            const q = document.getElementById('search-box').value.toLowerCase();
            const grid = document.getElementById('cards-grid');
            const openIds = new Set(
                Array.from(document.querySelectorAll('.psych-card.revealed')).map(c => Number(c.dataset.id))
            );
            grid.innerHTML = '';

            const filtered = hacks.filter(h => {
                const matchCat = currentCategory === 'all' || h.cat === currentCategory;
                const matchText = h.title.toLowerCase().includes(q) ||
                                  h.hook.toLowerCase().includes(q) ||
                                  h.secret.toLowerCase().includes(q) ||
                                  h.tag.toLowerCase().includes(q);
                return matchCat && matchText;
            });

            filtered.forEach(item => {
                const isFrozen = frozenCardIds.has(item.id);
                const isMelted = meltedCardIds.has(item.id);

                const card = document.createElement('article');
                card.className = 'psych-card';
                card.dataset.id = item.id;

                if (openIds.has(item.id)) card.classList.add('revealed');
                if (isFrozen) card.classList.add('frozen-mid-open');
                if (isMelted) card.classList.add('melted-box');

                card.addEventListener('pointerenter', () => { hoveredCardId = item.id; });
                card.addEventListener('pointermove', () => { hoveredCardId = item.id; });
                card.addEventListener('pointerleave', () => { if (hoveredCardId === item.id) hoveredCardId = null; });
                card.addEventListener('touchstart', () => { hoveredCardId = item.id; }, { passive: true });
                card.onclick = () => toggleCard(item.id, card);

                card.innerHTML = `
                    <div>
                        <div class="card-meta">
                            <span class="tag">${item.tag}</span>
                            <span style="font-size:0.72rem; color:var(--text-muted);">${isFrozen ? '❄️ FROZEN' : isMelted ? '🫠 MELTING' : 'TAP TO DECODE'}</span>
                        </div>
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-hook" style="margin-top:8px;">${item.hook}</p>
                    </div>
                    ${isFrozen ? `<div class="ice-banner">❄️ FROZEN MID-OPEN! Switch to ☀️ Summer to thaw, then come back.</div>` : ''}
                    ${isMelted ? `<div class="melt-drip-badge">🫠 MELTED BY SUMMER HEAT! Hold mouse here &amp; switch to ❄️ Winter!</div>` : ''}
                    <div class="card-secret">
                        <strong>Why it works:</strong> ${item.secret}
                    </div>
                    <div class="card-footer">
                        <span>PSYCHOLOGY INSIGHT</span>
                        <span>${isFrozen ? '[ICE LOCKED ❄️]' : '[EXPAND ↕]'}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function randomHack() {
            setCategory('all', document.querySelector('.cat-bar .pill-btn'));
            document.getElementById('search-box').value = '';
            filterCards();
            const cards = document.querySelectorAll('.psych-card');
            if (!cards.length) return;
            const pick = cards[Math.floor(Math.random() * cards.length)];
            const id = Number(pick.dataset.id);
            toggleCard(id, pick);
            pick.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        /* =========================================================
           INTERACTIVE BRAIN GLITCH LAB
           ========================================================= */
        let stroopStart = 0;
        let stroopAnswer = '';

        function renderStroop() {
            const colors = [
                { name: 'RED', hex: '#ef4444' },
                { name: 'BLUE', hex: '#38bdf8' },
                { name: 'GREEN', hex: '#22c55e' },
                { name: 'YELLOW', hex: '#eab308' }
            ];
            const wordObj = colors[Math.floor(Math.random() * colors.length)];
            let inkObj = colors[Math.floor(Math.random() * colors.length)];
            while (inkObj.name === wordObj.name) {
                inkObj = colors[Math.floor(Math.random() * colors.length)];
            }
            stroopAnswer = inkObj.name;
            stroopStart = performance.now();

            const stage = document.getElementById('lab-stage');
            stage.innerHTML = `
                <p style="font-size:0.8rem; color:var(--text-muted);">Click the <strong>INK COLOR</strong> (ignore what the word says!):</p>
                <div class="stroop-word" style="color:${inkObj.hex};">${wordObj.name}</div>
                <div class="choice-row">
                    ${colors.map(c => `<button class="pill-btn" onclick="checkStroop('${c.name}')">${c.name}</button>`).join('')}
                </div>
                <div id="stroop-feedback" style="font-size:0.78rem; font-weight:700; color:var(--accent-2);"></div>
            `;
        }

        function checkStroop(choice) {
            const ms = Math.round(performance.now() - stroopStart);
            const fb = document.getElementById('stroop-feedback');
            if (choice === stroopAnswer) {
                fb.innerText = `✅ Correct in ${ms}ms! Your prefrontal cortex overrode your automatic reading reflex.`;
                setTimeout(renderStroop, 1200);
            } else {
                fb.innerText = `❌ Tricked! Your brain read the word instead of seeing the ${stroopAnswer} ink.`;
            }
        }

        function renderAnchor() {
            const stage = document.getElementById('lab-stage');
            stage.innerHTML = `
                <p style="font-size:0.84rem; max-width:560px;">Quick gut check: Is the population of <strong>Canada</strong> higher or lower than <strong>95 million</strong>?</p>
                <div class="choice-row">
                    <button class="pill-btn" onclick="anchorStep2()">Higher than 95M</button>
                    <button class="pill-btn" onclick="anchorStep2()">Lower than 95M</button>
                </div>
            `;
        }

        function anchorStep2() {
            const stage = document.getElementById('lab-stage');
            stage.innerHTML = `
                <p style="font-size:0.84rem;">Now type your exact guess for Canada's population (in millions):</p>
                <div class="choice-row">
                    <input type="number" id="anchor-guess" placeholder="e.g. 65" style="padding:8px 12px; border-radius:8px; border:1.5px solid var(--border); background:var(--card-bg); color:var(--text); width:120px;">
                    <button class="action-btn" onclick="anchorReveal()">Reveal Trap</button>
                </div>
            `;
        }

        function anchorReveal() {
            const stage = document.getElementById('lab-stage');
            stage.innerHTML = `
                <p style="font-size:0.84rem; max-width:600px; line-height:1.5;">
                    Canada's actual population is ~<strong>41 million</strong>. Because we planted <strong>95 million</strong> as an anchor first, most people guess between 55M and 80M—far higher than people anchored with 15M!
                </p>
                <button class="pill-btn" onclick="renderAnchor()">↺ Replay Trap</button>
            `;
        }

        function renderZeigarnik() {
            const stage = document.getElementById('lab-stage');
            stage.innerHTML = `
                <p style="font-size:0.84rem; max-width:580px; line-height:1.5;">
                    Read this sequence once: <strong>7 — 2 — 9 — 4 — ?</strong><br>
                    Notice how your brain automatically itches to complete the pattern? That open loop is the <strong>Zeigarnik Effect</strong>—why cliffhangers and unfinished tasks stay stuck in RAM until resolved.
                </p>
                <button class="action-btn" onclick="this.innerText='Loop Closed ✓ (Tension Released)'">Close the Mental Loop</button>
            `;
        }

        function switchLab(mode, btn) {
            document.querySelectorAll('.lab-tabs .pill-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            if (mode === 'stroop') renderStroop();
            if (mode === 'anchor') renderAnchor();
            if (mode === 'zeigarnik') renderZeigarnik();
        }

        // Boot saved season
        const savedSeason = localStorage.getItem('little_psych_season') || 'autumn';
        const savedSeasonBtn = document.querySelector(`[data-set-season="${savedSeason}"]`);
        setSeason(savedSeason, savedSeasonBtn);

        renderStroop();
    </script>
</body>
</html>
